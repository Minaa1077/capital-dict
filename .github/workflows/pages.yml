# GitHub Pages 发布流水线
#
# 触发：推送到 main（或手动 Run workflow）
# 三步：构建单文件产物 → 装配发布目录 → 上传并部署
#
# 为什么在 CI 里构建而不是提交产物：
#   ① 产物 3.4 MB，提交进仓库会让每次改动都产生二元大文件，历史膨胀；
#   ② 用自定义工作流发布时，GitHub 的「10 次构建/小时」软限不适用；
#   ③ 站点是零依赖 Node 脚本，CI 里不需要 npm install，构建约几秒。
#
# 需要的仓库设置：Settings → Pages → Build and deployment → Source = GitHub Actions

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一条发布流水线；不取消正在进行的部署，避免半成品上线
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 读取站点最终地址（含自定义域名），供 canonical / og:image 使用
      - name: Resolve site base URL
        id: pages
        uses: actions/configure-pages@v5

      - name: Build offline single-file site
        run: node scripts/build.mjs --offline

      # 装配发布目录。
      # 绑了自定义域名时 base_url 会是 https://<域>/（configure-pages 读仓库 Pages 设置），
      # 此时同时把主机名传给 --domain：产出一份 CNAME（内容只有裸域），
      # canonical / og:image 也跟着变成自定义域，不必再改脚本或提交 CNAME 文件。
      - name: Assemble publish directory
        run: |
          set -e
          BASE="${{ steps.pages.outputs.base_url }}"
          HOST="$(node -e 'try{console.log(new URL(process.argv[1]).host)}catch(e){console.log("")}' "$BASE")"
          case "$HOST" in
            ""|*.github.io) node scripts/make-pages.mjs --base "$BASE" ;;
            *)              node scripts/make-pages.mjs --base "$BASE" --domain "$HOST" ;;
          esac
          echo "site base = $BASE   host = ${HOST:-<github.io>}"

      # 上线前的机器校验：产物存在、体积合理、索引与 404 到位
      - name: Verify publish directory
        run: |
          set -e
          test -s _site/index.html || { echo "缺少 index.html"; exit 1; }
          test -s _site/404.html   || { echo "缺少 404.html"; exit 1; }
          test -f _site/.nojekyll  || { echo "缺少 .nojekyll"; exit 1; }
          test -s _site/marx-pictorial.html || { echo "缺少画传子页，画传入口会 404"; exit 1; }
          test -s _site/pathflow.html       || { echo "缺少关系图子页，关系图入口会 404"; exit 1; }
          grep -q 'name="robots" content="index,follow"' _site/index.html || { echo "robots 未改为 index,follow"; exit 1; }
          grep -q 'rel="canonical"' _site/index.html || { echo "缺少 canonical"; exit 1; }
          size=$(wc -c < _site/index.html)
          echo "index.html = $size bytes"
          [ "$size" -gt 2000000 ] || { echo "产物异常偏小，疑似构建不完整"; exit 1; }
          du -sh _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 放在 job 级，才能被下面步骤的 if 引用（step 级 env 对自己的 if 不可见）
    env:
      CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 发版后清 Cloudflare 边缘缓存。
      # 没配 secret 时整步跳过（不会让构建失败），配了就自动清，省掉手动 Purge Everything。
      # 需要的 secret：CF_PURGE_TOKEN —— 权限 Zone:Read + Cache Purge:Purge，资源限定 minaa.cloud。
      - name: Purge Cloudflare cache
        if: ${{ env.CF_PURGE_TOKEN != '' }}
        run: |
          set -e
          ZONE_ID=$(curl -s -H "Authorization: Bearer $CF_PURGE_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=minaa.cloud" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);const z=(j.result||[])[0];console.log(z?z.id:"")}catch(e){console.log("")}})')
          if [ -z "$ZONE_ID" ]; then
            echo "::warning::未能读取 minaa.cloud 的 Zone ID（Token 是否含 Zone:Read？），跳过清缓存"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $CF_PURGE_TOKEN" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache")
          echo "purge http=$CODE zone=$ZONE_ID"
          [ "$CODE" = "200" ] || { echo "::warning::清缓存返回 $CODE，请手动 Purge Everything"; exit 0; }
          echo "Cloudflare 缓存已清"
