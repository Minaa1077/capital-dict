],"pinyin":"shang pin","initials":"sp","oneline":"商品是为交换而生产的劳动产品，同时具有使用价值与价值二重属性。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shiyongjiazhi","term":"使用价值","en":"use-value","alias":["有用性","Gebrauchswert"],"pinyin":"shi yong jia zhi","initials":"syjz","oneline":"使用价值指物品能满足人的某种需要的有用性，是商品的自然属性。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jiazhi","term":"价值","en":"value","alias":["商品价值","Wert"],"pinyin":"jia zhi","initials":"jz","oneline":"价值是凝结在商品中的无差别的一般人类劳动，它决定商品的交换比例。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shehuibiyaolaodongshijian","term":"社会必要劳动时间","en":"socially necessary labour time","alias":["社会必要劳动量"],"pinyin":"she hui bi yao lao dong shi jian","initials":"shbydsj","oneline":"社会必要劳动时间指在现有社会正常生产条件和社会平均熟练程度下生产一件商品所需要的时间，它决定商品的价值量。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jutilaodong","term":"具体劳动","en":"concrete labour","alias":["有用劳动"],"pinyin":"ju ti lao dong","initials":"jtld","oneline":"具体劳动指有特定目的、操作方式、对象、手段和结果的劳动，它创造使用价值。","domain":"dom-zzjj","category":"sub-jb"},{"id":"chouxianglaodong","term":"抽象劳动","en":"abstract labour","alias":["一般人类劳动"],"pinyin":"chou xiang lao dong","initials":"cxld","oneline":"抽象劳动指撇开一切具体形式之后剩下的人类劳动力的一般耗费，它形成商品的价值。","domain":"dom-zzjj","category":"sub-jb"},{"id":"laodongerchongxing","term":"劳动二重性","en":"dual character of labour","alias":["劳动的二重性"],"pinyin":"lao dong er chong xing","initials":"ldecx","oneline":"劳动二重性指生产商品的同一劳动既是具体劳动又是抽象劳动，前者创造使用价值，后者形成价值。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shangpinbaiwujiao","term":"商品拜物教","en":"commodity fetishism","alias":["拜物教","Fetischismus"],"pinyin":"shang pin bai wu jiao","initials":"spbwj","oneline":"商品拜物教指商品生产者之间的社会关系被表现为物与物之间的关系，并被误认为物的天然属性。","domain":"dom-zx","category":"sub-sz"},{"id":"huobi","term":"货币","en":"money","alias":["一般等价物","Geld"],"pinyin":"huo bi","initials":"hb","oneline":"货币是从商品世界中分离出来、固定充当一般等价物的商品。","domain":"dom-zzjj","category":"sub-jb"},{"id":"laodongli","term":"劳动力","en":"labour power","alias":["劳动能力","Arbeitskraft"],"pinyin":"lao dong li","initials":"ldl","oneline":"劳动力指存在于活的人体中、在生产中运用的人的体力与脑力的总和，在资本主义条件下成为商品。","domain":"dom-zzjj","category":"sub-jb"},{"id":"guyonglaodong","term":"雇佣劳动","en":"wage labour","alias":["雇佣劳动与资本"],"pinyin":"gu yong lao dong","initials":"gyld","oneline":"雇佣劳动指工人把劳动力出卖给资本以换取工资的劳动形式，是资本主义生产的基础。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shengyujiazhi","term":"剩余价值","en":"surplus value","alias":["Mehrwert"],"pinyin":"sheng yu jia zhi","initials":"syjz","oneline":"剩余价值指工人创造的超过劳动力价值的那部分价值，被资本家无偿占有。","domain":"dom-zzjj","category":"sub-jb"},{"id":"bubianziben","term":"不变资本","en":"constant capital","alias":["C"],"pinyin":"bu bian zi ben","initials":"bbzb","oneline":"不变资本指转化为生产资料的那部分资本，它只把原有价值转移到产品中去，并不改变自己的价值量。","domain":"dom-zzjj","category":"sub-jb"},{"id":"kebianziben","term":"可变资本","en":"variable capital","alias":["V"],"pinyin":"ke bian zi ben","initials":"kbzb","oneline":"可变资本指用于购买劳动力的那部分资本，它在生产过程中再生产出自身并带来剩余价值。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shengyujiazhilv","term":"剩余价值率","en":"rate of surplus value","alias":["剥削率","m/v"],"pinyin":"sheng yu jia zhi lv","initials":"syjzl","oneline":"剩余价值率是剩余价值与可变资本的比率，表示劳动力受资本剥削的程度。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jiqihedagongye","term":"机器和大工业","en":"machinery and large-scale industry","alias":["机器","大工业"],"pinyin":"ji qi he da gong ye","initials":"jqhdgy","oneline":"机器本身是提高劳动生产率的手段，在资本主义应用中则成为生产剩余价值的手段。","domain":"dom-zzjj","category":"sub-jb"},{"id":"zibenzhiji","term":"资本积累","en":"accumulation of capital","alias":["积累","Accumulation"],"pinyin":"zi ben ji lei","initials":"zbjl","oneline":"资本积累指把剩余价值重新转化为资本，使资本规模不断扩大。","domain":"dom-zx","category":"sub-jb"},{"id":"yuanshijilei","term":"原始积累","en":"primitive accumulation","alias":["所谓原始积累"],"pinyin":"yuan shi ji lei","initials":"ysjl","oneline":"原始积累指资本关系形成之前劳动者被剥夺生产资料的历史过程，就其内容而言即原始剥夺。","domain":"dom-zx","category":"sub-jxd"},{"id":"pingtaijingji","term":"平台经济","en":"platform economy","alias":["平台资本主义","数字平台"],"pinyin":"ping tai jing ji","initials":"ptjj","oneline":"平台经济指以数字平台为中介撮合供需、并依靠抽成与数据获取收益的经济形态。","domain":"dom-zzjj","category":"sub-zgh"},{"id":"linggonglaodong","term":"零工劳动","en":"gig work","alias":["零工经济","灵活就业"],"pinyin":"ling gong lao dong","initials":"lgld","oneline":"零工劳动指不固定雇主、按单接活、按件计酬的劳动形式，其形式自由而保障薄弱。","domain":"dom-zzjj","category":"sub-sz"},{"id":"zibenlun","term":"《资本论》","en":"Capital","alias":["Das Kapital","资本论","政治经济学批判"],"pinyin":"zi ben lun","initials":"zbl","oneline":"《资本论》是马克思历时四十年写作、第二三卷由恩格斯整理出版的政治经济学批判巨著。","domain":"dom-zzjj","category":"sub-fzs"},{"id":"makesi","term":"马克思","en":"Karl Marx","alias":["卡尔·马克思","Karl Marx"],"pinyin":"ma ke si","initials":"mks","oneline":"马克思（1818—1883），德国思想家，唯物史观与剩余价值学说的创立者，《资本论》的作者。","domain":"dom-kxsh","category":"sub-fzs"},{"id":"ziben","term":"资本","en":"capital","alias":["Kapital"],"pinyin":"zi ben","initials":"zb","oneline":"资本是能够带来剩余价值的价值，其前提是能够买到劳动力这一特殊商品。","domain":"dom-zzjj","category":"sub-jb"},{"id":"gongzi","term":"工资","en":"wages","alias":["劳动力价格","计时工资","计件工资"],"pinyin":"gong zi","initials":"gz","oneline":"工资在现象形态上表现为劳动的报酬，实质上是劳动力价值或价格的转化形式。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jiazhireguilv","term":"价值规律","en":"the law of value","alias":["价值法则"],"pinyin":"jia zhi gui lv","initials":"jzgl","oneline":"价值规律指商品按照由社会必要劳动时间决定的价值量进行交换的必然趋势。","domain":"dom-zzjj","category":"sub-jb"},{"id":"zibenzonggongshi","term":"资本总公式","en":"the general formula of capital","alias":["G—W—G′","资本的一般公式"],"pinyin":"zi ben zong gong shi","initials":"zbzgs","oneline":"资本总公式为 G—W—G′，其起点与终点同为货币，而终点必须大于起点。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jiazhibizeng","term":"价值增殖过程","en":"valorisation process (self-expansion of value)","alias":["价值增殖","Verwertungsprozess"],"pinyin":"jia zhi zeng zhi guo cheng","initials":"jzzzgc","oneline":"价值增殖过程指超过一定点而延长了的价值形成过程，即剩余价值的生产过程。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jueduishengyujiazhi","term":"绝对剩余价值","en":"absolute surplus value","alias":["absoluter Mehrwert"],"pinyin":"jue dui sheng yu jia zhi","initials":"jdsyjz","oneline":"绝对剩余价值指在必要劳动时间不变的条件下，通过延长工作日而生产的剩余价值。","domain":"dom-zzjj","category":"sub-jb"},{"id":"xiangduishengyujiazhi","term":"相对剩余价值","en":"relative surplus value","alias":["relativer Mehrwert"],"pinyin":"xiang dui sheng yu jia zhi","initials":"xdsyjz","oneline":"相对剩余价值指工作日长度不变，通过提高劳动生产率缩短必要劳动时间而生产的剩余价值。","domain":"dom-zzjj","category":"sub-jb"},{"id":"chaoshengyujiazhi","term":"超额剩余价值","en":"extra surplus value","alias":["extra surplus value"],"pinyin":"chao e sheng yu jia zhi","initials":"cesyjz","oneline":"超额剩余价值指个别企业因商品的个别价值低于社会价值而获得的额外剩余价值。","domain":"dom-zzjj","category":"sub-jb"},{"id":"zibenyoujigoucheng","term":"资本有机构成","en":"the organic composition of capital","alias":["c:v","资本构成"],"pinyin":"zi ben you ji gou cheng","initials":"zbyjgc","oneline":"资本有机构成指由资本技术构成决定并反映技术构成变化的资本价值构成。","domain":"dom-zzjj","category":"sub-jb"},{"id":"xiangduiguoshengrenkou","term":"相对过剩人口","en":"the relative surplus population","alias":["产业后备军","相对人口过剩"],"pinyin":"xiang dui guo sheng ren kou","initials":"xdgsrk","oneline":"相对过剩人口指相对于资本增殖需要而言显得多余的劳动人口，即产业后备军。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jiandanzaishengchan","term":"简单再生产","en":"simple reproduction","alias":["einfache Reproduktion"],"pinyin":"jian dan zai sheng chan","initials":"jdzsc","oneline":"简单再生产指在原有规模上重复进行的生产过程，它揭示出资本主义关系的持续性。","domain":"dom-zzjj","category":"sub-jb"},{"id":"laodongguocheng","term":"劳动过程","en":"labour process","alias":["Arbeitsprozess"],"pinyin":"lao dong guo cheng","initials":"ldgc","oneline":"劳动过程指人以自身的活动来调整和控制人与自然之间的物质变换的过程，任何社会形态都存在。","domain":"dom-zzjj","category":"sub-jb"},{"id":"xiezuo","term":"协作","en":"cooperation","alias":["简单协作","Kooperation"],"pinyin":"xie zuo","initials":"xz","oneline":"协作指许多人在同一生产过程中、或在不同的但互相联系的生产过程中有计划地共同劳动。","domain":"dom-zzjj","category":"sub-jb"},{"id":"gongzuori","term":"工作日","en":"the working day","alias":["劳动日","Arbeitstag"],"pinyin":"gong zuo ri","initials":"gzr","oneline":"工作日的长度没有自然界的界限，它由阶级力量的对比来决定。","domain":"dom-zzjj","category":"sub-jb"},{"id":"engesi","term":"恩格斯","en":"Friedrich Engels","alias":["Friedrich Engels"],"pinyin":"en ge si","initials":"egs","oneline":"恩格斯（1820—1895），马克思的亲密合作者，《资本论》第二、三卷的整理出版者。","domain":"dom-kxsh","category":"sub-fzs"},{"id":"zhengzhijingjixuepipan","term":"《政治经济学批判》","en":"A Contribution to the Critique of Political Economy","alias":["1859年第一分册"],"pinyin":"zheng zhi jing ji xue pi pan","initials":"zzjjxpp","oneline":"《政治经济学批判》是 1859 年出版的著作，为《资本论》的前身，其序言载有唯物史观的经典表述。","domain":"dom-zzjj","category":"sub-fzs"},{"id":"jingjixuezhexueshougao","term":"《1844年经济学哲学手稿》","en":"Economic and Philosophic Manuscripts of 1844","alias":["巴黎手稿","1844年手稿"],"pinyin":"jing ji xue zhe xue shou gao","initials":"jjxzxshg","oneline":"《1844年经济学哲学手稿》是马克思早期未刊手稿，提出异化劳动理论，构成政治经济学批判的起点。","domain":"dom-zx","category":"sub-fzs"},{"id":"laodongyihua","term":"劳动异化","en":"alienated labour","alias":["异化劳动","Entfremdung"],"pinyin":"lao dong yi hua","initials":"ldyh","oneline":"劳动异化指劳动者所创造的产品和自己的活动反过来支配劳动者自身，是手稿批判的核心问题。","domain":"dom-zx","category":"sub-fzs"},{"id":"weiwushiguan","term":"唯物史观","en":"historical materialism","alias":["历史唯物主义","唯物主义历史观"],"pinyin":"wei wu shi guan","initials":"wwsg","oneline":"唯物史观指以生产力与生产关系的矛盾运动解释历史发展，是《资本论》的理论前提。","domain":"dom-zx","category":"sub-fzs"},{"id":"gudianzhengzhijingjixue","term":"古典政治经济学","en":"classical political economy","alias":["古典经济学","资产阶级古典政治经济学"],"pinyin":"gu dian zheng zhi jing ji xue","initials":"gdzjjjx","oneline":"古典政治经济学指从斯密到李嘉图的劳动价值论传统，它既是马克思的理论来源，也是其批判对象。","domain":"dom-zzjj","category":"sub-fzs"},{"id":"shuzilaodong","term":"数字劳动","en":"digital labour","alias":["平台劳动","数字劳动论"],"pinyin":"shu zi lao dong","initials":"szld","oneline":"数字劳动指由算法组织与调度、以数字平台为载体的劳动形式。","domain":"dom-zzjj","category":"sub-zgh"},{"id":"shujushangpinhua","term":"数据商品化","en":"commodification of data","alias":["数据商品","数据要素化"],"pinyin":"shu ju shang pin hua","initials":"sjcph","oneline":"数据商品化指把人的行为轨迹转化为可交易商品的过程，数据是当代最典型的商品形态。","domain":"dom-zz -fzs"},{"id":"feierbaha","term":"费尔巴哈","en":"Feuerbach (Ludwig Feuerbach)","alias":[],"pinyin":"fei er ba ha","initials":"febh","oneline":"费尔巴哈（1804—1872），德国哲学家，把哲学从宗教与思辨中拉回感性的人，但仍停留在抽象的人。","domain":"dom-zx","category":"sub-fzs"},{"id":"puludong","term":"蒲鲁东","en":"Proudhon (Pierre-Joseph Proudhon)","alias":[],"pinyin":"pu lu dong","initials":"pld","oneline":"蒲鲁东（1809—1865），法国经济学家，以「财产就是盗窃」闻名，其观点是马克思《哲学的贫困》的批判对象。","domain":"dom-zzjj","category":"sub-fzs"},{"id":"weilianwoerfu","term":"威廉·沃尔弗","en":"Wilhelm Wolff","alias":[],"pinyin":"wei lian wo er fu","initials":"wlwef","oneline":"威廉·沃尔弗（1809—1864），德国工人运动活动家，《资本论》第一卷扉页献词所纪念的人。","domain":"dom-zzjj","category":"sub-fzs"},{"id":"kuinai","term":"魁奈","en":"François Quesnay","alias":[],"pinyin":"kui nai","initials":"kn","oneline":"魁奈（1694—1774），法国重农学派的创始人，最早试图以《经济表》描绘社会再生产的整体过程。","domain":"dom-zzjj","category":"sub-fzs"},{"id":"ouwen","term":"欧文","en":"Robert Owen","alias":[],"pinyin":"ou wen","initials":"ow","oneline":"欧文（1771—1858），英国空想社会主义者，在新拉纳克工厂进行合作与教育实验，是三大空想家中唯一从事实际改革的人。","domain":"dom-kxsh","category":"sub-fzs"},{"id":"fuliye","term":"傅立叶","en":"Charles Fourier","alias":[],"pinyin":"fu li ye","initials":"fly","oneline":"傅立叶（1772—1837），法国空想社会主义者，对资本主义文明作了尖锐批判，并最早指出妇女解放的尺度意义。","domain":"dom-kxsh","category":"sub-fzs"},{"id":"lening","term":"列宁","en":"Vladimir Lenin","alias":[],"pinyin":"lie ning","initials":"ln","oneline":"列宁（1870—1924），俄国革命家，把《资本论》的分析推进到帝国主义阶段，并领导十月革命取得胜利。","domain":"dom-kxsh","category":"sub-fzs"},{"id":"huobiziben","term":"货币资本","en":"money capital","alias":[],"pinyin":"huo bi zi ben","initials":"hbzb","oneline":"货币资本指在资本循环中执行购买生产资料与劳动力职能的资本形式。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shengchanziben","term":"生产资本","en":"productive capital","alias":[],"pinyin":"sheng chan zi ben","initials":"sczb","oneline":"生产资本指以生产资料和劳动力形式存在、在生产过程中执行增殖职能的资本形式。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shangpinziben","term":"商品资本","en":"commodity capital","alias":[],"pinyin":"shang pin zi ben","i en":"the trinity formula","alias":[],"pinyin":"san wei yi ti de gong shi","initials":"swytdgs","oneline":"三位一体的公式指资本—利润、土地—地租、劳动—工资这一公式，它把各种收入说成各生产要素的自然产物。","domain":"dom-zx","category":"sub-jb"},{"id":"ziyouwangguo","term":"自由王国","en":"the realm of freedom","alias":[],"pinyin":"zi you wang guo","initials":"zywg","oneline":"自由王国指以人的能力自身发展为目的的领域，它只在必要性和外在目的所规定的劳动终止的地方才开始。","domain":"dom-kxsh","category":"sub-jb"},{"id":"jiaoyisuo","term":"交易所","en":"the stock exchange","alias":[],"pinyin":"jiao yi suo","initials":"jys","oneline":"交易所指有价证券与商品投机的中心场所，社会生产的运动在此形式上表现为证券行情的运动。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jingjiweiji","term":"经济危机","en":"economic crisis","alias":[],"pinyin":"jing ji wei ji","initials":"jjwj","oneline":"经济危机指资本主义再生产过程中周期性爆发的生产过剩危机，其直接表现是商品向货币转化的中断。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jingxiantiaoyue","term":"惊险的跳跃","en":"the salto mortale of the commodity","alias":[],"pinyin":"jing xian de tiao yue","initials":"jxdty","oneline":"惊险的跳跃指商品向货币的转化，如果这一转化失败，摔坏的不是商品而是商品占有者。","domain":"dom-zzjj","category":"sub-jb"},{"id":"yibandengjiawu","term":"一般等价物","en":"universal equivalent","alias":[],"pinyin":"yi ban deng jia wu","initials":"ybdjw","oneline":"一般等价物指从商品世界中分离出来、公认为一切商品价值表现材料的商品。","domain":"dom-zzjj","category":"sub-jb"},{"id":"laodongduixiang","term":"劳动对象","en":"objects of labour","alias":[],"pinyin":"lao dong dui xiang","initials":"lddx","oneline":"劳动对象指劳动加于其上的一切东西，其中已经被过去的劳动滤过的称为原料。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jiandanfuzalaodong","term":"简单劳动与复杂劳动","en":"simple and complex labour","alias":[],"pinyin":"jian dan yu fu za lao dong","initials":"jdfzld","oneline":"简单劳动与复杂劳动指无须专门训练的劳动和须经专门训练的劳动，少量复杂劳动可以折算为大量简单劳动。","domain":"dom-zzjj","category":"sub-jb"},{"id":"laodonglijiazhi","term":"劳动力价值","en":"value of labour power","alias":[],"pinyin":"lao dong li jia zhi","initials":"ldljz","oneline":"劳动力价值指维持和再生产劳动者本人及其家庭所必需的生活资料的价值。","domain":"dom-zzjj","category":"sub-jb"},{"id":"laodongshengchanli","term":"劳动生产力","en":"productive power of labour","alias":[],"pinyin":"lao dong sheng chan li","initials":"ldscl","oneline":"劳动生产力指劳动的效率，劳动生产力越高，生产单位商品所需的劳动时间越少，单位商品的价值也就越小。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jishigongzi","term":"计时工资","en":"time-wages","alias":[],"pinyin":"ji shi gong zi","initials":"jsgz","oneline":"计时工资指按劳动时间支付的工资，同一日工资额可以代表极不相同的劳动价格。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jijiangongzi","term":"计件工资","en":"piece-wages","alias":[],"pinyin":"ji jian gong zi","initials":"jjgz","oneline":"计件工资指按产品件数支付的工资，它是计时工资的转化形式，并把监督成本转嫁给工人自身。","domain":"dom-zzjj","category":"sub-jb"},{"id":"mingyigongzi","term":"名义工资与实际工资","en":"nominal and real wages","alias":[],"pinyin":"ming yi gong zi yu shi ji gong zi","initials":"mygz","oneline":"名义工资指以货币额表示的工资，实际工资指工资所能购买的生活资料量，二者并不一致。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jijuyujizhong","term":"资本的积聚与集中","en":"concentration and centralisation of capital","alias":[],"pinyin":"zi ben de ji ju yu ji zhong","initials":"zdbjjyjz","oneline":"资本的积聚与集中指单个资本通过剩余价值的资本化而增大，以及既有资本通过吞并或联合而集中。","domain":"dom-zzjj","category":"sub-jb"},{"id":"chanyehoubeijun","term":"产业后备军","en":"the industrial reserve army","alias":[],"pinyin":"chan ye hou bei jun","initials":"cyhbj","oneline":"产业后备军指相对过剩人口所形成的、可供资本随时支配的失业劳动大军，它压低在业工人的工资。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shichangjiazhi","term":"市场价值","en":"market value","alias":[],"pinyin":"shi chang jia zhi","initials":"scjz","oneline":"市场价值指由一个部门内商品生产的平均条件所决定的价值，市场价格围绕它上下波动。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shengchanshijian","term":"生产时间与流通时间","en":"production time and circulation time","alias":[],"pinyin":"sheng chan shi jian yu liu tong shi jian","initials":"scsjyltsj","oneline":"生产时间与流通时间指资本依次处于生产领域与流通领域所经历的时间，只有前者才增殖价值。","domain":"dom-zzjj","category":"sub-jb"},{"id":"laodongjijin","term":"劳动基金","en":"the labour fund","alias":[],"pinyin":"lao dong ji jin","initials":"ldjj","oneline":"劳动基金指任何社会形态中都存在的、用于维持劳动者生存的消费资料总额，工资只是它的资本主义历史形式。","domain":"dom-zzjj","category":"sub-jb"},{"id":"zhouzhuanzhouqi","term":"周转周期","en":"the cycle of turnover","alias":[],"pinyin":"zhou zhuan zhou qi","initials":"zzzq","oneline":"周转周期指由固定资本的平均寿命所决定的资本周转周期，它为周期性的经济危机提供了物质基础。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jiaohuanjiazhi","term":"交换价值","en":"exchange-value","alias":[],"pinyin":"jiao huan jia zhi","initials":"jhjz","oneline":"交换价值指一种使用价值同另一种使用价值相交换的量的比例，是价值的表现形式。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jiazhishiti","term":"价值实体","en":"substance of value","alias":[],"pinyin":"jia zhi shi ti","initials":"jzst","oneline":"价值实体指价值的社会实体，即凝结在商品中的抽象人类劳动。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jiazhiliang","term":"价值量","en":"magnitude of value","alias":[],"pinyin":"jia zhi liang","initials":"jzl","oneline":"价值量指商品价值的大小，由生产该商品所耗费的社会必要劳动时间决定。","domain":"dom-zzjj","category":"sub-jb"},{"id":"sirenlaodong","term":"私人劳动","en":"private labour","alias":[],"pinyin":"si ren lao dong","initials":"srld","oneline":"私人劳动指商品生产者的劳动由于生产资料私有制而首先具有的私人性质，其社会性只能通过交换事后实现。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shehuifengong","term":"社会分工","en":"social division of labour","alias":[],"pinyin":"she hui fen gong","initials":"shfg","oneline":"社会分工指社会劳动划分为不同部门的体系，它是商品生产存在的条件，而商品生产并不是社会分工存在的条件。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jiagebiaozhun","term":"价格标准","en":"standard of price","alias":[],"pinyin":"jia ge biao zhun","initials":"jgbz","oneline":"价格标准指货币以一定的金属重量为单位衡量商品价值量的职能，它与价值尺度的职能不同。","domain":"dom-zzjj","category":"sub-jb"},{"id":"zhubi","term":"铸币","en":"coin","alias":[],"pinyin":"zhu bi","initials":"zb","oneline":"铸币指货币执行流通手段职能时所采取的形式，它由国家的印记所确认。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jiazhifuhao","term":"价值符号","en":"money tokens (symbols of value)","alias":[],"pinyin":"jia zhi fu hao","initials":"jzfh","oneline":"价值符号指代替金银执行流通手段职能的纸币等符号，它只有代表金量才成为价值符号。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shangpindexingtaibianhua","term":"商品的形态变化","en":"the metamorphoses of commodities","alias":[],"pinyin":"shang pin de xing tai bian hua","initials":"spdxtbh","oneline":"商品的形态变化指商品交换过程中由商品到货币、再由货币到商品这两个相互补充的转化。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jiaohuanguocheng","term":"交换过程","en":"the process of exchange","alias":[],"pinyin":"jiao huan guo cheng","initials":"jhgc","oneline":"交换过程指商品占有者彼此让渡自己的商品的过程，它必然表现为以契约为形式的法律关系。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jiazhixingchengguocheng","term":"价值形成过程","en":"value-forming process","alias":[],"pinyin":"jia zhi xing cheng guo cheng","initials":"jzxcgc","oneline":"价值形成过程指劳动过程同时又是价值形成过程，新价值被加入而生产资料的旧价值被转移。","domain":"dom-zzjj","category":"sub-jb"},{"id":"boxue","term":"剥削","en":"exploitation","alias":[],"pinyin":"bo xue","initials":"bx","oneline":"剥削指资本家无偿占有工人所创造的剩余价值，剩余价值率是衡量剥削程度的准确尺度。","domain":"dom-zzjj","category":"sub-jb"},{"id":"zibendeshengchanxing","term":"资本的生产性","en":"the productivity of capital","alias":[],"pinyin":"zi ben de sheng chan xing","initials":"zbdscx","oneline":"资本的生产性指资本所表现的生产力，即资本强迫工人进行剩余劳动的能力。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shengchanlaodongyufeishengchanlaodong","term":"生产劳动与非生产劳动","en":"productive and unproductive labour","alias":[],"pinyin":"sheng chan lao dong yu fei sheng chan lao dong","initials":"scldyfscld","oneline":"生产劳动与非生产劳动指在资本主义生产中只有生产剩余价值的劳动才是生产劳动。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shengyulaodongshijian","term":"剩余劳动时间","en":"surplus labour time","alias":[],"pinyin":"sheng yu lao dong shi jian","initials":"syldsj","oneline":"剩余劳动时间指工作日中用于为资本家生产剩余价值的那部分时间。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shengyujiazhideshengchan","term":"剩余价值的生产","en":"the production of surplus value","alias":[],"pinyin":"sheng yu jia zhi de sheng chan","initials":"syjzdsc","oneline":"剩余价值的生产指资本主义生产的实质，延长工作日与提高劳动生产率是生产剩余价值的两条途径。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shengchanguosheng","term":"生产过剩","en":"overproduction","alias":[],"pinyin":"sheng chan guo sheng","initials":"scgs","oneline":"生产过剩指资本主义生产周期中商品供给超过有支付能力的需求的现象。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shengchandeshehuixing","term":"生产的社会性","en":"the social character of production","alias":[],"pinyin":"sheng chan de she hui xing","initials":"scdshx","oneline":"生产的社会性指生产日益成为社会化的过程，它反过来表现为支配生产者的强制权威。","domain":"dom-zx","category":"sub-jb"},{"id":"shengchandewuzhengfuzhuangtai","term":"生产的无政府状态","en":"the anarchy of production","alias":[],"pinyin":"sheng chan de wu zheng fu zhuang tai","initials":"scdwzfzt","oneline":"生产的无政府状态指社会分工所建立的联系在资本主义条件下表现为盲目起作用的自然规律。","domain":"dom-zx","category":"sub-jb"},{"id":"yibanlirunlv","term":"一般利润率","en":"the general rate of profit","alias":[],"pinyin":"yi ban li run lv","initials":"yblrl","oneline":"一般利润率指各部门的特殊利润率通过资本竞争而趋于平均化的结果。","domain":"dom-zzjj","category":"sub-jb"},{"id":"gongzideguominchayi","term":"工资的国民差异","en":"national differences of wages","alias":[],"pinyin":"gong zi de guo min cha yi","initials":"gzdgmcy","oneline":"工资的国民差异指各国工资水平的差别必须还原为劳动强度与劳动力价值的差别才能进行比较。","domain":"dom-zzjj","category":"sub-jb"},{"id":"gongchanglifa","term":"工厂立法","en":"factory legislation","alias":[],"pinyin":"gong chang li fa","initials":"gclf","oneline":"工厂立法指由法律强制规定的劳动时间界限，它是工人阶级长期斗争的产物。","domain":"dom-zzjj","category":"sub-jb"},{"id":"gongchangzhidu","term":"工厂制度","en":"the factory system","alias":[],"pinyin":"gong chang zhi du","initials":"gczd","oneline":"工厂制度指以机器体系为基础的工厂组织形式，它把协作置于兵营式的纪律之下。","domain":"dom-zzjj","category":"sub-jb"},{"id":"zibenzhuyizhanyouguilv","term":"资本主义占有规律","en":"the law of capitalist appropriation","alias":[],"pinyin":"zi ben zhu yi zhan you gui lv","initials":"zbzyzygl","oneline":"资本主义占有规律指等价交换的规律通过自身的辩证法转变为对他人劳动的无偿占有。","domain":"dom-zzjj","category":"sub-jb"},{"id":"siyouzhi","term":"私有制","en":"private property","alias":[],"pinyin":"si you zhi","initials":"syz","oneline":"私有制指生产资料归私人占有的制度，其中以自己劳动为基础的私有制与以剥削他人劳动为基础的私有制性质不同。","domain":"dom-zzjj","category":"sub-jb"},{"id":"yuanshiboduo","term":"原始剥夺","en":"primitive expropriation","alias":[],"pinyin":"yuan shi bo duo","initials":"ysbd","oneline":"原始剥夺指劳动者被强行同劳动资料分离的历史过程，就其内容而言原始积累即原始剥夺。","domain":"dom-zzjj","category":"sub-jb"},{"id":"guozhaizhidu","term":"国债制度","en":"the system of public debt","alias":[],"pinyin":"guo zhai zhi du","initials":"gzzd","oneline":"国债制度指国债、殖民制度、税收制度和保护关税制度相互结合所构成的原始积累体系。","domain":"dom-zzjj","category":"sub-jb"},{"id":"ziyougongren","term":"自由工人","en":"the free worker","alias":[],"pinyin":"zi you gong ren","initials":"zygr","oneline":"自由工人指双重意义上的自由：既有人身自由，又自由得一无所有。","domain":"dom-zzjj","category":"sub-jb"},{"id":"nongyegeming","term":"农业革命","en":"the agricultural revolution","alias":[],"pinyin":"nong ye ge ming","initials":"nygm","oneline":"农业革命指对农村居民的反复剥夺，它为城市工业提供了不受行会约束的无产者。","domain":"dom-zx","category":"sub-jxd"},{"id":"shehuilaodong","term":"社会劳动","en":"social labour","alias":[],"pinyin":"she hui lao dong","initials":"shld","oneline":"社会劳动指在社会分工体系中为他人、为社会提供商品而进行的劳动，其社会性通过交换得到证实。","domain":"dom-zzjj","category":"sub-jb"},{"id":"chanyeziben","term":"产业资本","en":"industrial capital","alias":[],"pinyin":"chan ye zi ben","initials":"cyzb","oneline":"产业资本指依次采取货币资本、生产资本、商品资本三种形式并不断变换职能的资本。","domain":"dom-zzjj","category":"sub-jb"},{"id":"laodongqijian","term":"劳动期间","en":"the labour period","alias":[],"pinyin":"lao dong qi jian","initials":"ldqj","oneline":"劳动期间指为提供一件成品所必须依次连接的许多工作日。","domain":"dom-zzjj","category":"sub-jb"},{"id":"zhouzhuancishu","term":"周转次数","en":"the number of turnovers","alias":[],"pinyin":"zhou zhuan ci shu","initials":"zzcs","oneline":"周转次数指一年与资本周转时间之比。","domain":"dom-zzjj","category":"sub-jb"},{"id":"gudingzibendesunhao","term":"固定资本的损耗","en":"wear and tear of fixed capital","alias":[],"pinyin":"gu ding zi ben de sun hao","initials":"gdzbdsh","oneline":"固定资本的损耗指固定资本的价值随使用而逐步转移到产品中去，并以折旧的形式逐年流回。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shengchanchubei","term":"生产储备","en":"productive supply","alias":[],"pinyin":"sheng chan chu bei","initials":"sccb","oneline":"生产储备指为保证生产过程连续进行而必须持有的原料、辅助材料等潜在生产基金。","domain":"dom-zzjj","category":"sub-jb"},{"id":"nianshengyujiazhilv","term":"年剩余价值率","en":"the annual rate of surplus value","alias":[],"pinyin":"nian sheng yu jia zhi lv","initials":"nsyjzl","oneline":"年剩余价值率指一年内生产的剩余价值总额与预付可变资本之比，它随资本周转速度而变化。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shehuizongchanpin","term":"社会总产品","en":"the aggregate social product","alias":[],"pinyin":"she hui zong chan pin","initials":"shzcp","oneline":"社会总产品指全社会在一年内生产的全部产品，考察它时必须先撇开固定资本未获实物补偿的部分。","domain":"dom-zzjj","category":"sub-jb"},{"id":"zhejiujijin","term":"折旧基金","en":"depreciation fund","alias":[],"pinyin":"zhe jiu ji jin","initials":"zjjj","oneline":"折旧基金指为在若干年后整体替换固定资本而逐年提取的货币准备金。","domain":"dom-zzjj","category":"sub-jb"},{"id":"zibenyouli","term":"资本游离","en":"release of capital (Freisetzung)","alias":[],"pinyin":"zi ben you li","initials":"zbyl","oneline":"资本游离指为使生产过程在流通期间得以继续而必须游离出来的那部分流动资本。","domain":"dom-zzjj","category":"sub-jb"},{"id":"liutongshijian","term":"流通时间","en":"circulation time","alias":[],"pinyin":"liu tong shi jian","initials":"ltsj","oneline":"流通时间指资本依次通过生产领域与流通领域这两个阶段所需要的时间。","domain":"dom-zzjj","category":"sub-jb"},{"id":"zhouzhuansudu","term":"周转速度","en":"velocity of turnover","alias":[],"pinyin":"zhou zhuan su du","initials":"zzsd","oneline":"周转速度指资本周转的快慢，生产行为持续时间的差别必然带来周转速度与预付时间上的差别。","domain":"dom-zzjj","category":"sub-jb"},{"id":"ziranli","term":"自然力","en":"natural forces","alias":[],"pinyin":"zi ran li","initials":"zrl","oneline":"自然力指人自身作为一种自然力而与自然物质相对立，人通过劳动占有自然力。","domain":"dom-zzjj","category":"sub-jb"},{"id":"lirunlv","term":"利润率","en":"rate of profit","alias":[],"pinyin":"li run lv","initials":"lrl","oneline":"利润率指剩余价值与全部预付资本之比，剩余价值在此取得了利润这一转化形式。","domain":"dom-zzjj","category":"sub-jb"},{"id":"bubianzibenshiyongshangdejieyue","term":"不变资本使用上的节约","en":"economy in the use of constant capital","alias":[],"pinyin":"bu bian zi ben shi yong shang de jie yue","initials":"bbzbsysdjy","oneline":"不变资本使用上的节约指资本主义生产方式在发展生产力的同时节约不变资本的使用。","domain":"dom-zzjj","category":"sub-jb"},{"id":"gongqiuguanxi","term":"供求关系","en":"supply and demand","alias":[],"pinyin":"gong qiu guan xi","initials":"gqgx","oneline":"供求关系指商品供给与需求之间的关系，它说明价格的波动，但不说明价格由什么决定。","domain":"dom-zzjj","category":"sub-jb"},{"id":"chaoelirun","term":"超额利润","en":"extra profit","alias":[],"pinyin":"chao e li run","initials":"celr","oneline":"超额利润指个别生产价格低于社会生产价格的生产者所获得的额外剩余价值。","domain":"dom-zzjj","category":"sub-jb"},{"id":"xujiadeshehuijiazhi","term":"虚假的社会价值","en":"false social value","alias":[],"pinyin":"xu jia de she hui jia zhi","initials":"xjdshjz","oneline":"虚假的社会价值指由市场价值规律造成、并不代表实际劳动耗费的那部分社会价值。","domain":"dom-zzjj","category":"sub-jb"},{"id":"chuncuiliutongfeiyong","term":"纯粹流通费用","en":"pure circulation costs","alias":[],"pinyin":"chun cui liu tong fei yong","initials":"ccltfy","oneline":"纯粹流通费用指由商品价值的形式变换所引起的、不加入商品价值的流通费用。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jiedaiziben","term":"借贷资本","en":"loan capital (loanable capital)","alias":[],"pinyin":"jie dai zi ben","initials":"jdzb","oneline":"借贷资本指为了取得利息而暂时贷给职能资本家使用的货币资本。","domain":"dom-zzjj","category":"sub-jb"},{"id":"lixilv","term":"利息率","en":"rate of interest","alias":[],"pinyin":"li xi lv","initials":"lxl","oneline":"利息率指利息与借贷资本之比，它没有自然的界限，由竞争与一般利润率共同规定。","domain":"dom-zzjj","category":"sub-jb"},{"id":"yinhangquan","term":"银行券","en":"banknote","alias":[],"pinyin":"yin hang quan","initials":"yhq","oneline":"银行券指银行发行的、代替商业票据流通的信用货币。","domain":"dom-zzjj","category":"sub-jb"},{"id":"youjiazhengquan","term":"有价证券","en":"securities","alias":[],"pinyin":"you jia zheng quan","initials":"yjzq","oneline":"有价证券指对收益的索取权凭证，包括国债券、国库券、股票等。","domain":"dom-zzjj","category":"sub-jb"},{"id":"tiexian","term":"贴现","en":"discounting","alias":[],"pinyin":"tie xian","initials":"tx","oneline":"贴现指银行按票面额扣除到期前利息、购入未到期商业票据的业务。","domain":"dom-zzjj","category":"sub-jb"},{"id":"gupiao","term":"股票","en":"shares (stocks)","alias":[],"pinyin":"gu piao","initials":"gp","oneline":"股票指对企业收益的按份索取权，其价格随预期收益与利息率的变动而独立运动。","domain":"dom-zzjj","ca tegory":"sub-jb"},{"id":"shehuishengchanli","term":"社会生产力","en":"the productive forces of society","alias":[],"pinyin":"she hui sheng chan li","initials":"shscl","oneline":"社会生产力指社会变革的物质力量，社会变革的解释要到生产力与生产关系的现存冲突中去寻找。","domain":"dom-zx","category":"sub-jb"},{"id":"huobidezhineng","term":"货币的职能","en":"the functions of money","alias":[],"pinyin":"huo bi de zhi neng","initials":"hbdzn","oneline":"货币的职能指货币作为价值尺度、流通手段、贮藏手段、支付手段和世界货币所执行的职能。","domain":"dom-zzjj","category":"sub-jb"},{"id":"laodongdeshehuishengchanli","term":"劳动的社会生产力","en":"social productive power of labour","alias":[],"pinyin":"lao dong de she hui sheng chan li","initials":"lddshscl","oneline":"劳动的社会生产力指由协作与分工产生的生产力，在资本主义条件下它表现为资本的生产力。","domain":"dom-zzjj","category":"sub-jb"},{"id":"shengyujiazhideshixian","term":"剩余价值的实现","en":"the realisation of surplus value","alias":[],"pinyin":"sheng yu jia zhi de shi xian","initials":"syjzdsx","oneline":"剩余价值的实现指剩余价值必须通过商品的出售才能实现，生产出剩余价值并不等于实现了剩余价值。","domain":"dom-zzjj","category":"sub-jb"},{"id":"zibenzonggongshidemaodun","term":"资本总公式的矛盾","en":"the contradiction of the general formula of capital","alias":[],"pinyin":"zi ben zong gong shi de mao dun","initials":"zbzgsdmd","oneline":"资本总公式的矛盾指资本不能从流通中产生，又不能不从流通中产生，这一矛盾由劳动力的买卖得到解决。","domain":"dom-zzjj","category":"sub-jb"},{"id":"laodongjiage","term":"劳动价格","en":"price of labour","alias":[],"pinyin":"lao dong jia ge","initials":"ldjg","oneline":"劳动价格是一个不合理的用语，「劳动的价格」实际上是劳动力价值的转化形式。","domain":"dom-zzjj","category":"sub-jb"},{"id":"laodongduizibendecongshu","term":"劳动对资本的从属","en":"subsumption of labour under capital","alias":[],"pinyin":"lao dong dui zi ben de cong shu","initials":"lddzbdcs","oneline":"劳动对资本的从属指劳动在形式上或实际上隶属于资本，管理职能因而成为资本的职能。","domain":"dom-zzjj","category":"sub-jb"},{"id":"buduangeming","term":"不断革命","en":"permanent revolution","alias":["经常的革命"],"pinyin":"bu duan ge ming","initials":"bdgm","oneline":"不断革命指无产阶级的利益和任务在于把革命推向前进，直到无产阶级夺得国家政权。","domain":"dom-kxsh","category":"sub-jb"},{"id":"congchouxiangshangshengdaojuti","term":"从抽象上升到具体","en":"rising from the abstract to the concrete","alias":["上升法"],"pinyin":"chou xiang sheng dao ju ti","initials":"ccxssdjt","oneline":"从抽象上升到具体指从最简单的抽象规定出发、在思维中逐步再现具体总体的方法，它是思维掌握具体的方式。","domain":"dom-zx","category":"sub-fzs"},{"id":"dasuiguojijiqi","term":"打碎国家机器","en":"smashing the state machine","alias":["摧毁国家机器"],"pinyin":"da sui guo jia ji qi","initials":"dsgjjq","oneline":"打碎国家机器指以往的一切变革都只是使军事官僚机器更加完备，无产阶级革命则必须把它摧毁。","domain":"dom-kxsh","category":"sub-jb"},{"id":"duilitongyi","term":"对立统一","en":"unity of opposites","alias":["矛盾的统一","对立的相互渗透"],"pinyin":"dui li tong yi","initials":"dlty","oneline":"对立统一指两个相互矛盾方面的共存、斗争以及融合成一个新范畴，构成辩证运动的实质。","domain":"dom-zx","category":"sub-jb"},{"id":"duixianghua","term":"对象化","en":"objectification","alias":["劳动的对象化","Vergegenständlichung"],"pinyin":"dui xiang hua","initials":"dxh","oneline":"对象化指劳动把人的本质力量凝结在产品之中，它本身是中性的，异化则是它在私有制条件下的颠倒形态。","domain":"dom-zx","category":"sub-jb"},{"id":"fandongdeshehuizhuyi","term":"反动的社会主义","en":"reactionary socialism","alias":["封建的社会主义"],"pinyin":"fan dong de she hui zhu yi","initials":"fdshzy","oneline":"反动的社会主义指封建的、小资产阶级的和「真正的」社会主义，它们站在资产阶级的对立面却要求开历史的倒车。","domain":"dom-kxsh","category":"sub-jb"},{"id":"feiwuzhishengchan","term":"非物质生产","en":"immaterial production","alias":["服务劳动"],"pinyin":"fei wu zhi sheng chan","initials":"fwzsc","oneline":"非物质生产指在非物质领域进行的生产，它同样可以被资本主义组织起来，生产劳动的界限随资本而移动。","domain":"dom-zzjj","category":"sub-jb"},{"id":"foudingzhifouding","term":"否定之否定","en":"negation of negation","alias":["否定的否定","negation of negation"],"pinyin":"fou ding zhi fou ding","initials":"fdzfd","oneline":"否定之否定指资本主义私有制对个体私有制的否定，又将由资本主义自身的内在必然性所否定。","domain":"dom-zx","category":"sub-jb"},{"id":"ganxinghuodong","term":"感性活动","en":"sensuous activity","alias":["对象性的活动","sinnliche Tätigkeit"],"pinyin":"gan xing huo dong","initials":"gxhd","oneline":"感性活动指把对象、现实、感性当做感性的人的活动即实践去理解，它是新唯物主义的立足点。","domain":"dom-zx","category":"sub-jb"},{"id":"gaolidaijiben","term":"高利贷资本","en":"usurer's capital","alias":["生息资本的洪水期前形式"],"pinyin":"gao li dai zi ben","initials":"gldzb","oneline":"高利贷资本指生息资本的古老形式，它和商人资本同属于资本的洪水期前的形式。","domain":"dom-zzjj","category":"sub-jb"},{"id":"gemingdeshehuizhuyi","term":"革命的社会主义","en":"revolutionary socialism","alias":["革命的共产主义"],"pinyin":"ge ming de she hui zhu yi","initials":"gmshzy","oneline":"革命的社会主义指宣布不断革命、主张无产阶级阶级专政的社会主义，是马克思在《法兰西阶级斗争》中对自己立场的命名。","domain":"dom-kxsh","category":"sub-jb"},{"id":"gemingdeshijian","term":"革命的实践","en":"revolutionary practice","alias":["环境的改变与人的活动的一致"],"pinyin":"ge ming de shi jian","initials":"gmdsj","oneline":"革命的实践指环境的改变和人的自我改变的一致，只能在革命的实践中得到理解。","domain":"dom-zx","category":"sub-jb"},{"id":"lianggejieduan","term":"共产主义两个阶段","en":"two phases of communism","alias":["第一阶段与高级阶段"],"pinyin":"gong chan zhu yi liang ge jie duan","initials":"gczylgjd","oneline":"共产主义两个阶段指共产主义社会分为刚从资本主义脱胎而来的第一阶段和在其自身基础上发展起来的高级阶段。","domain":"dom-kxsh","category":"sub-jb"},{"id":"gongrenmeiyouzuguo","term":"工人没有祖国","en":"workers have no fatherland","alias":[],"pinyin":"gong ren mei you zu guo","initials":"grmyzg","oneline":"工人没有祖国指工人无祖国可言，因而决不能剥夺他们所没有的东西。","domain":"dom-kxsh","category":"sub-jb"},{"id":"guanniandedongxi","term":"观念的东西","en":"the ideal","alias":["反映论"],"pinyin":"guan nian de dong xi","initials":"gndx","oneline":"观念的东西指移入人的头脑并在人的头脑中改造过的物质的东西。","domain":"dom-zx","category":"sub-jb"},{"id":"guodushiqi","term":"过渡时期","en":"transition period","alias":["革命转变时期"],"pinyin":"guo du shi qi","initials":"gdsq","oneline":"过渡时期指在资本主义社会和共产主义社会之间存在的革命转变时期。","domain":"dom-kxsh","category":"sub-jb"},{"id":"guojiaxiaowang","term":"国家消亡","en":"withering away of the state","alias":["自行消亡"],"pinyin":"guo jia xiao wang","initials":"gjxw","oneline":"国家消亡指国家不是被废除的，而是在阶级消灭之后自行消亡的。","domain":"dom-kxsh","category":"sub-jb"},{"id":"guominjingjixuepipan","term":"国民经济学批判","en":"critique of political economy","alias":["政治经济学批判"],"pinyin":"guo min jing ji xue pi pan","initials":"gmjjxp","oneline":"国民经济学批判指马克思对国民经济学从私有财产的事实出发却未能说明这一事实所作的批判。","domain":"dom-zzjj","category":"sub-fzs"},{"id":"huobizhiji","term":"货币危机","en":"monetary crisis","alias":["支付链断裂"],"pinyin":"huo bi zhi ji","initials":"hbwj","oneline":"货币危机指买卖的分离使危机成为可能，而货币发展为支付手段之后，危机便以货币危机的形式爆发。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jiaoyulaodongxiangjiehe","term":"教育与生产劳动相结合","en":"combining education with productive labour","alias":["教劳结合"],"pinyin":"jiao yu yu sheng chan lao dong xiang jie he","initials":"yyscxj","oneline":"教育与生产劳动相结合指智育和体育同体力劳动相结合，工厂法教育条款第一次证明了这种结合的可能性。","domain":"dom-kxsh","category":"sub-sz"},{"id":"jingjifanchou","term":"经济范畴","en":"economic categories","alias":["社会关系的理论表现"],"pinyin":"jing ji fan chou","initials":"jjfc","oneline":"经济范畴指生产的社会关系的理论表现，即其抽象。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jingzhengyulongduan","term":"竞争与垄断","en":"competition and monopoly","alias":["自由竞争"],"pinyin":"jing zheng yu long duan","initials":"jzyld","oneline":"竞争与垄断指竞争是特定生产关系的产物，它不能靠法令来摆脱，并与垄断相互转化。","domain":"dom-zzjj","category":"sub-jb"},{"id":"kafudingxia","term":"跨越卡夫丁峡谷","en":"crossing the Caudine Forks","alias":["不通过资本主义制度的卡夫丁峡谷"],"pinyin":"kua yue ka fu ding xia gu","initials":"kykfdxg","oneline":"跨越卡夫丁峡谷指俄国农村公社在特定的历史环境中有可能不通过资本主义制度的卡夫丁峡谷，而占有资本主义制度创造的积极成果。","domain":"dom-kxsh","category":"sub-fzs"},{"id":"leibenzhi","term":"类本质","en":"species-being","alias":["类存在物","Gattungswesen"],"pinyin":"lei ben zhi","initials":"lbz","oneline":"类本质指人作为类存在物把自己的生命活动当作对象、因而能够自由地对待自己对象的特性。","domain":"dom-zx","category":"sub-jb"},{"id":"lilunwozhongqunzhong","term":"理论掌握群众","en":"theory grasping the masses","alias":["物质力量"],"pinyin":"li lun zhang wo qun zhong","initials":"llzrqz","oneline":"理论掌握群众指理论一经掌握群众就会变成物质力量，而理论只要彻底就能说服人。","domain":"dom-zx","category":"sub-jb"},{"id":"lishihelilun","term":"历史合力论","en":"theory of historical resultant force","alias":["总的合力"],"pinyin":"li shi he li lun","initials":"lshll","oneline":"历史合力论指无数交错的单个意志融合为一个总的合力，历史的结果并非任何个人意志的完全实现。","domain":"dom-zx","category":"sub-fzs"},{"id":"liangbianzhibian","term":"量变质变","en":"quantitative-qualitative change","alias":["量转化为质","质量互变"],"pinyin":"liang bian zhi bian","initials":"lbzb","oneline":"量变质变指量的变化积累到一定的关节点便引起质的改变，度是理解这一规律的钥匙。","domain":"dom-zx","category":"sub-jb"},{"id":"lianggejujue","term":"两个决裂","en":"two ruptures","alias":["传统观念的决裂"],"pinyin":"liang ge jue lie","initials":"lgjl","oneline":"两个决裂指共产主义革命同传统的所有制关系实行最彻底的决裂，并同传统的观念实行最彻底的决裂。","domain":"dom-kxsh","category":"sub-jb"},{"id":"liuyeqiyi","term":"六月起义","en":"June Days uprising","alias":["1848年六月起义"],"pinyin":"liu yue qi yi","initials":"lyqy","oneline":"六月起义指 1848 年巴黎无产阶级被迫发动的起义，马克思称之为现代社会中两大对立阶级间的第一次伟大战斗。","domain":"dom-kxsh","category":"sub-jb"},{"id":"rendejiefang","term":"人的解放","en":"human emancipation","alias":["人的解放的头脑与心脏"],"pinyin":"ren de jie fang","initials":"rdjf","oneline":"人的解放指以哲学为头脑、以无产阶级为心脏的彻底解放，它不同于在既有国家框架之内实现的政治解放。","domain":"dom-zx","category":"sub-jb"},{"id":"renmenzijiachuangzaolishi","term":"人们自己创造历史","en":"people make their own history","alias":["既定条件下创造"],"pinyin":"ren men zi ji chuang zao li shi","initials":"rmzjczls","oneline":"人们自己创造历史指人们自己创造自己的历史，但并不是在他们自己选定的条件下创造。","domain":"dom-zx","category":"sub-jb"},{"id":"sandachabie","term":"三大差别","en":"three major differences","alias":["工农差别、城乡对立、脑体对立"],"pinyin":"san da cha bie","initials":"sdcb","oneline":"三大差别指工农差别、城乡差别和脑力劳动与体力劳动的差别，它们的消失是实行按需分配的物质前提之一。","domain":"dom-kxsh","category":"sub-jb"},{"id":"shehuigeming","term":"社会革命","en":"social revolution","alias":["革命是历史的火车头"],"pinyin":"she hui ge ming","initials":"shgm","oneline":"社会革命指触及生产方式与阶级关系本身的革命，马克思称革命是历史的火车头。","domain":"dom-kxsh","category":"sub-jb"},{"id":"shijianbiaozhun","term":"实践标准","en":"criterion of practice","alias":["思维的真理性"],"pinyin":"shi jian biao zhun","initials":"sjbz","oneline":"实践标准指思维是否具有客观真理性不是一个理论问题而是一个实践问题，实践是检验真理的唯一标准。","domain":"dom-zx","category":"sub-jb"},{"id":"tudiguoyouhua","term":"土地国有化","en":"nationalization of land","alias":["土地国有"],"pinyin":"tu di guo you hua","initials":"tdgyh","oneline":"土地国有化指在无产阶级政权的条件下把土地收归国有，从而彻底改变劳动和资本的关系。","domain":"dom-zzjj","category":"sub-jb"},{"id":"weiwubianzhengfa","term":"唯物辩证法","en":"materialist dialectics","alias":["合理的辩证法"],"pinyin":"wei wu bian zheng fa","initials":"wwbzf","oneline":"唯物辩证法指在对现存事物的肯定理解中同时包含对它的否定理解，辩证法不崇拜任何东西。","domain":"dom-zx","category":"sub-jb"},{"id":"lishishiming","term":"无产阶级的历史使命","en":"historical mission of the proletariat","alias":["资本主义的掘墓人"],"pinyin":"wu chan jie ji de li shi shi ming","initials":"wcjjlssm","oneline":"无产阶级的历史使命指资产阶级首先生产出的是它自身的掘墓人，无产阶级的解放具有世界历史意义。","domain":"dom-kxsh","category":"sub-jb"},{"id":"wuchanjiejiguojizhuyi","term":"无产阶级国际主义","en":"proletarian internationalism","alias":["国际联合"],"pinyin":"wu chan jie ji guo ji zhu yi","initials":"wcjjgjzy","oneline":"无产阶级国际主义指各文明国家无产阶级的联合行动是无产阶级获得解放的首要条件之一。","domain":"dom-kxsh","category":"sub-jb"},{"id":"wuchanjiejipinkunhua","term":"无产阶级贫困化","en":"immiseration of the proletariat","alias":["贫困的积累"],"pinyin":"wu chan jie ji pin kun hua","initials":"wcjjpkh","oneline":"无产阶级贫困化指社会财富积累的一极同时是贫困、劳动折磨、受奴役和无知的积累。","domain":"dom-zzjj","category":"sub-jb"},{"id":"wuchanjiejizhengdang","term":"无产阶级政党","en":"proletarian party","alias":["共产党人"],"pinyin":"wu chan jie ji zheng dang","initials":"wcjjzd","oneline":"无产阶级政党指共产党人不是同其他工人政党相对立的特殊政党，他们没有同整个无产阶级利益不同的利益。","domain":"dom-kxsh","category":"sub-jb"},{"id":"wuzhibianhuan","term":"物质变换","en":"metabolism","alias":["新陈代谢","Stoffwechsel"],"pinyin":"wu zhi bian huan","initials":"wzbh","oneline":"物质变换指劳动是人与自然之间的物质变换过程，资本主义会系统性地破坏这一变换。","domain":"dom-zx","category":"sub-jb"},{"id":"wuzhiyuyundong","term":"物质与运动","en":"matter and motion","alias":["运动是物质的存在方式"],"pinyin":"wu zhi yu yun dong","initials":"wzyd","oneline":"物质与运动指运动是物质的存在方式，没有运动的物质和没有物质的运动同样不可想象。","domain":"dom-zx","category":"sub-jb"},{"id":"xiaoshengchan","term":"小生产","en":"small-scale production","alias":["小农经济","简单商品生产"],"pinyin":"xiao sheng chan","initials":"xsc","oneline":"小生产指以劳动者对生产资料的私有权为基础的生产形式，它既养育了资本主义，又被资本主义所消灭。","domain":"dom-zzjj","category":"sub-jb"},{"id":"yibanzhili","term":"一般智力","en":"general intellect","alias":["普遍智力","general intellect"],"pinyin":"yi ban zhi li","initials":"ybzl","oneline":"一般智力指一般社会知识在何等程度上变成了直接的生产力，是《机器论片段》提出的重要范畴。","domain":"dom-zzjj","category":"sub-jb"},{"id":"yishimeiyoulishi","term":"意识没有历史","en":"ideology has no history","alias":[],"pinyin":"yi shi mei you li shi","initials":"ysmyls","oneline":"意识没有历史指道德、宗教、形而上学等没有历史、没有发展，发展着的是物质生产与物质交往。","domain":"dom-zx","category":"sub-jb"},{"id":"zibenwenmingzuoyong","term":"资本的文明作用","en":"civilizing influence of capital","alias":["伟大的文明作用"],"pinyin":"zi ben de wen ming zuo yong","initials":"zbwmyz","oneline":"资本的文明作用指只有资本才创造出资产阶级社会并造成社会成员对自然界的普遍占有，它同时包含自身的界限。","domain":"dom-zzjj","category":"sub-jb"},{"id":"zibenzhuyijibenmaodun","term":"资本主义基本矛盾","en":"basic contradiction of capitalism","alias":["生产社会化与资本主义占有的矛盾"],"pinyin":"zi ben zhu yi ji ben mao dun","initials":"zbzjjbmd","oneline":"资本主义基本矛盾指社会化生产和资本主义占有之间的矛盾，它是无产阶级与资产阶级对立的经济根源。","domain":"dom-kxsh","category":"sub-jb"},{"id":"ziyoumaoyi","term":"自由贸易","en":"free trade","alias":["贸易自由"],"pinyin":"zi you mao yi","initials":"zymy","oneline":"自由贸易指自由贸易制度正在瓦解各民族并使无产阶级和资产阶级的对立达到顶点，它加速了社会革命的物质条件的成熟。","domain":"dom-zzjj","category":"sub-jb"},{"id":"ziyoushijian","term":"自由时间","en":"free time","alias":["非劳动时间","freie Zeit"],"pinyin":"zi you shi jian","initials":"zysj","oneline":"自由时间指时间是人类发展的空间，一个人如果没有自己处置的自由时间，其处境就无异于役畜。","domain":"dom-zx","category":"sub-jb"},{"id":"zongjiaopipan","term":"宗教批判","en":"critique of religion","alias":["人民的鸦片"],"pinyin":"zong jiao pi pan","initials":"zjpp","oneline":"宗教批判指对宗教的批判是一切其他批判的前提，宗教是苦难的间接表现，也是对苦难的抗议。","domain":"dom-zx","category":"sub-jb"},{"id":"chss","term":"从后思索","en":"retrospective understanding","alias":["人体解剖与猴体解剖"],"pinyin":"cong hou si suo","initials":"chss","oneline":"高级社会形态是理解低级形态的钥匙：人体解剖是猴体解剖的一把钥匙。","domain":"dom-zx","category":"sub-jb"},{"id":"hbzhzbzxxe","term":"货币转化为资本的最低限额","en":"the minimum amount required to become capital","alias":["最低限额的资本","量变到质变的转化"],"pinyin":"huo bi zhuan hua wei zi ben de zui xiao xian e","initials":"hbzhzbzxxe","oneline":"不是任何货币额都能变资本：预付超过最低限额，资本家才不必亲自劳动。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jqtx","term":"机器体系","en":"the machinery system","alias":["自动的机器体系","大工业的生产机体"],"pinyin":"ji qi ti xi","initials":"jqtx","oneline":"在机器体系中，大工业有完全客观的生产机体，工人只是它的附件。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jdldyzhld","term":"监督劳动与指挥劳动","en":"supervising and directing labour","alias":["指挥的两重性","管理劳动的二重性"],"pinyin":"jian du lao dong yu zhi hui lao dong","initials":"jdldyzhld","oneline":"指挥出自协作，监督出自对抗：管理的两重性要分开算账。","domain":"dom-zzjj","category":"sub-jb"},{"id":"jj","term":"阶级","en":"class","alias":["现代社会的三大阶级"],"pinyin":"jie ji","initials":"jj","oneline":"雇佣工人、资本家、土地所有者，构成现代社会的三大阶级。","domain":"dom-kxsh","category":"sub-jb"},{"id":"jjdzx","term":"经济斗争的界限","en":"the limits of economic struggle","alias":["日常斗争的界限","止痛剂与病根"],"pinyin":"jing ji dou zheng de jie xian","initials":"jjdzx","oneline":"日常斗争反对的是结果而非原因：止痛剂有效，祛除病根还得靠制度变革。","domain":"dom-kxsh","category":"sub-jb"},{"id":"kxscl","term":"科学是生产力","en":"science as a productive force","alias":["生产力中也包括科学"],"pinyin":"ke xue shi sheng chan li","initials":"kxscl","oneline":"生产力中也包括科学：知识不是生产的旁观者，而是生产的内在要素。","domain":"dom-zzjj","category":"sub-jb"},{"id":"ldfcxdx","term":"劳动范畴的现代性","en":"the modernity of the category of labour","alias":["劳动一般","最简单的抽象"],"pinyin":"lao dong fan chou de xian dai xing","initials":"ldfcxdx","oneline":"「劳动」看似最简单，其实只有现代雇佣社会才造出这个最一般的抽象。","domain":"dom-zx","category":"sub-jb"},{"id":"ltlyydy","term":"流通领域的伊甸园","en":"the Eden of the innate rights of man","alias":["天赋人权的真正伊甸园"],"pinyin":"liu tong ling yu de yi dian yuan","initials":"ltlyydy","oneline":"流通领域确是天赋人权的伊甸园——自由平等的背后，是劳动力的买和卖。","domain":"dom-zzjj","category":"sub-jb"},{"id":"pzdg","term":"普照的光","en":"the pervading light","alias":["特殊的以太","主导关系的决定作用"],"pinyin":"pu zhao de guang","initials":"pzdg","oneline":"在每一个社会里，总有一种生产如普照的光，掩盖并改变着其他一切关系的色彩。","domain":"dom-zx","category":"sub-jb"},{"id":"rlsshsqsq","term":"人类社会的史前时期","en":"the prehistory of human society","alias":["真正的历史","史前史命题"],"pinyin":"ren lei she hui de shi qian shi qi","initials":"rlsshsqsq","oneline":"资产阶级社会是人类的史前时期：它的终结即真正历史的开端。","domain":"dom-zx","category":"sub-jb"},{"id":"scfpjhxf","term":"生产、分配、交换、消费","en":"production, distribution, exchange and consumption","alias":["社会再生产四环节","生产总过程"],"pinyin":"sheng chan fen pei jiao huan xiao fei","initials":"scfpjhxf","oneline":"生产、分配、交换、消费不是四件并列的事，而是一个总体的各个环节。","domain":"dom-zzjj","category":"sub-jb"},{"id":"wjcxkx","term":"危机的抽象可能性","en":"the abstract possibility of crisis","alias":["危机的一般可能性","危机的形式与现实"],"pinyin":"wei ji de chou xiang ke neng xing","initials":"wjcxkx","oneline":"买卖分离已藏着危机的抽象可能性；它何时变现实，要看资本的形态变化。","domain":"dom-zzjj","category":"sub-jb"},{"id":"xdgyjsjc","term":"现代工业的技术基础","en":"the revolutionary technical basis of modern industry","alias":["技术基础的革命性"],"pinyin":"xian dai gong ye de ji shu ji chu","initials":"xdgyjsjc","oneline":"现代工业的技术基础是革命的，一切以往生产方式的技术基础本质上是保守的。","domain":"dom-zzjj","category":"sub-jb"},{"id":"xdgz","term":"相对工资","en":"relative wages","alias":["相对份额工资"],"pinyin":"xiang dui gong zi","initials":"xdgz","oneline":"工资可按名义不变而地位下降：相对工资量的是工人与资本家分蛋糕的比例。","domain":"dom-zzjj","category":"sub-jb"},{"id":"yxyscfs","term":"亚细亚生产方式","en":"Asiatic mode of production","alias":["亚细亚的所有制形式"],"pinyin":"ya xi ya sheng chan fang shi","initials":"yxyscfs","oneline":"大体说来，亚细亚的、古典古代的、封建的和现代资产阶级的生产方式，是演进的几个时代。","domain":"dom-zx","category":"sub-jb"},{"id":"ysfdzbph","term":"艺术发展的不平衡","en":"uneven development of art","alias":["艺术生产与物质生产发展的不平衡"],"pinyin":"yi shu fa zhan de bu ping heng","initials":"ysfdzbph","oneline":"艺术的繁盛时期决不同社会的一般发展成比例，经济不是艺术的直通桥。","domain":"dom-zx","category":"sub-jb"},{"id":"znxp","term":"重农学派","en":"the Physiocrats","alias":["重农主义者","法国重农学派"],"pinyin":"zhong nong xue pai","initials":"znxp","oneline":"重农学派把「纯产品」归功于农业，是第一个把剩余价值考察移入生产领域的学派。","domain":"dom-zzjj","category":"sub-jb"},{"id":"zszy","term":"重商主义","en":"mercantilism","alias":["重工主义","商业主义"],"pinyin":"zhong shang zhu yi","initials":"zszy","oneline":"重商主义在流通里找财富、重金主义在货币里找财富——都不是在劳动里找。","domain":"dom-zzjj","category":"sub-jb"},{"id":"zbzsyiqiandexingshi","term":"资本主义生产以前的各种形式","en":"pre-capitalist economic forms","alias":["三种所有制形式","前资本主义诸形式"],"pinyin":"zi ben zhu yi sheng chan yi qian de ge zhong xing shi","initials":"zbyq","oneline":"资本之前不是真空：亚细亚、古典、日耳曼三种所有制形式各有各的共同体结构。","domain":"dom-zx","category":"sub-jb"},{"id":"anxufenpei","term":"按需分配","en":"distribution according to needs","alias":["各尽所能，按需分配"],"pinyin":"an xu fen pei","initials":"axfp","oneline":"在劳动成为生活的第一需要之后，社会才能在旗帜上写上：各尽所能，按需分配。","domain":"dom-kxsh","category":"sub-jb"},{"id":"blyjj","term":"暴力与经济","en":"violence and economy","alias":["暴力论","经济利益是目的"],"pinyin":"bao li yu jing ji","initials":"blyjj","oneline":"暴力仅仅是手段，经济利益才是目的：政治暴力说到底由经济关系决定。","domain":"dom-zzjj","category":"sub-jb"},{"id":"bzfgl","term":"辩证法的规律","en":"the laws of dialectics","alias":["三大规律","自然史根据"],"pinyin":"bian zheng fa de gui lü","initials":"bzfgl","oneline":"辩证法的规律是从自然界和人类社会的历史中抽象出来的，不是外加于事实的先验图式。","domain":"dom-zx","category":"sub-jb"},{"id":"chengxiangduili","term":"城乡对立","en":"the antithesis between town and country","alias":["城乡分离","工农业结合"],"pinyin":"cheng xiang dui li","initials":"cxdl","oneline":"城乡对立不是自然事实而是历史产物：住宅问题要随对立的消灭才能解决。","domain":"dom-kxsh","category":"sub-jb"},{"id":"ddlsx","term":"道德的历史性","en":"the historicity of morality","alias":["阶级的道德","超历史道德批判"],"pinyin":"dao de de li shi xing","initials":"ddlsx","oneline":"一切以往的道德论归根到底都是当时社会经济状况的产物：道德始终是阶级的道德。","domain":"dom-zx","category":"sub-jb"},{"id":"gongpu","term":"公仆","en":"public servants","alias":["社会公仆与社会主人","随时罢免"],"pinyin":"gong pu","initials":"gp","oneline":"公社用两个可靠的办法，防止国家和国家机关由社会公仆变为社会主人。","domain":"dom-kxsh","category":"sub-jb"},{"id":"hzsc","term":"合作生产","en":"co-operative production","alias":["合作运动","合作工厂"],"pinyin":"he zuo sheng chan","initi
